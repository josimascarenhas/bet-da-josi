name: Atualizar notícias GE

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar notícias do ge.globo.com
        run: python3 "Cursor - Bet das Apostas/scripts/fetch-ge-news.py"

      - name: Commit em main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Cursor - Bet das Apostas/docs/live/news.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/news.json"
          git diff --staged --quiet || git commit -m "chore: atualizar notícias do ge.globo.com"
          git push

      - name: Publicar em gh-pages
        run: |
          cp "Cursor - Bet das Apostas/docs/live/news.json" news.json.tmp
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p live
          mv news.json.tmp live/news.json
          git add live/news.json
          git diff --staged --quiet || git commit -m "chore: atualizar notícias do ge.globo.com"
          git push origin gh-pages

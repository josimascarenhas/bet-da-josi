name: Atualizar notícias GE

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar notícias do ge.globo.com
        run: python3 "Cursor - Bet das Apostas/scripts/fetch-ge-news.py"

      - name: Sincronizar calendários europeus
        run: python3 "Cursor - Bet das Apostas/scripts/sync-league-calendars.py"

      - name: Atualizar placares e estatísticas dos jogos finalizados
        run: python3 "Cursor - Bet das Apostas/scripts/update-from-results.py"

      - name: Gerar intel (xG, descanso, desfalques)
        run: python3 "Cursor - Bet das Apostas/scripts/fetch-football-intel.py"

      - name: Gerar odds de mercado
        run: python3 "Cursor - Bet das Apostas/scripts/fetch-odds.py"

      - name: Commit em main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Cursor - Bet das Apostas/docs/calendario.js" \
                  "Cursor - Bet das Apostas/docs/live/news.json" \
                  "Cursor - Bet das Apostas/docs/live/intel.json" \
                  "Cursor - Bet das Apostas/docs/live/odds.json" \
                  "Cursor - Bet das Apostas/docs/live/scores.json" \
                  "Cursor - Bet das Apostas/docs/live/results.json" \
                  "Cursor - Bet das Apostas/docs/live/football.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/news.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/intel.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/odds.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/scores.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/results.json" \
                  "Cursor - Bet das Apostas/copa-brasil-apostas/live/football.json"
          git diff --staged --quiet || git commit -m "chore: atualizar resultados, estatísticas e dados ao vivo"
          git push

      - name: Publicar em gh-pages
        run: |
          cp "Cursor - Bet das Apostas/docs/calendario.js" calendario.js.tmp
          cp "Cursor - Bet das Apostas/docs/live/news.json" news.json.tmp
          cp "Cursor - Bet das Apostas/docs/live/intel.json" intel.json.tmp
          cp "Cursor - Bet das Apostas/docs/live/odds.json" odds.json.tmp
          cp "Cursor - Bet das Apostas/docs/live/scores.json" scores.json.tmp
          cp "Cursor - Bet das Apostas/docs/live/results.json" results.json.tmp
          cp "Cursor - Bet das Apostas/docs/live/football.json" football.json.tmp
          git fetch origin gh-pages
          git checkout gh-pages
          mv calendario.js.tmp calendario.js
          mkdir -p live
          mv news.json.tmp live/news.json
          mv intel.json.tmp live/intel.json
          mv odds.json.tmp live/odds.json
          mv scores.json.tmp live/scores.json
          mv results.json.tmp live/results.json
          mv football.json.tmp live/football.json
          git add calendario.js live/news.json live/intel.json live/odds.json live/scores.json live/results.json live/football.json
          git diff --staged --quiet || git commit -m "chore: atualizar resultados, estatísticas e dados ao vivo"
          git push origin gh-pages
